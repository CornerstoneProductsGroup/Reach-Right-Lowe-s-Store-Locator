<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reach Right USA | Lowe's Store Locator</title>
  <meta name="description" content="Map Lowe's stores carrying Reach Right USA.">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <img class="brand-logo" src="./assets/reach-right-logo.svg" alt="Reach Right USA">
      <h1>Lowe's Store Locator</h1>
      <p class="subtitle">Enter your ZIP code and distance to find nearby Lowe's stores carrying Reach Right USA.</p>
    </section>

    <section class="panel controls">
      <div class="form-grid">
        <div>
          <label for="zipCode">ZIP code</label>
          <input id="zipCode" inputmode="numeric" maxlength="5" placeholder="37067" aria-label="ZIP code">
        </div>
        <div>
          <label for="radiusMiles">Distance (miles)</label>
          <select id="radiusMiles" aria-label="Distance in miles">
            <option value="10">10 miles</option>
            <option value="25" selected>25 miles</option>
            <option value="50">50 miles</option>
            <option value="75">75 miles</option>
            <option value="100">100 miles</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button id="searchButton" type="button">Find Stores</button>
        <button id="exportButton" type="button" disabled>Export Results</button>
      </div>

      <p id="status" class="status">Ready.</p>
      <p class="hint">Search uses the Reach Right Lowe's list you provided. Results are ordered by closest distance.</p>
    </section>

    <div class="locator-layout">
      <section class="panel map-wrap">
        <div id="map" aria-label="Store map"></div>
      </section>

      <section class="panel results-wrap">
        <h2>Results</h2>
        <table id="resultsTable">
          <thead>
            <tr>
              <th>Store #</th>
              <th>Address</th>
              <th>Distance</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="3">Enter ZIP code and radius to search.</td>
            </tr>
          </tbody>
        </table>
      </section>

      <div class="tool-gallery" role="group" aria-label="Reach Right handle attachments">
        <img src="./assets/tools/tool-1.png" alt="Reach Right handle on a shovel" loading="lazy">
        <img src="./assets/tools/tool-2.png" alt="Reach Right handle on a floor squeegee" loading="lazy">
        <img src="./assets/tools/tool-3.png" alt="Reach Right handle on a pitchfork" loading="lazy">
        <img src="./assets/tools/tool-4.png" alt="Reach Right handle on a squeegee" loading="lazy">
        <img src="./assets/tools/tool-5.png" alt="Reach Right handle on a push broom" loading="lazy">
        <img src="./assets/tools/tool-6.png" alt="Reach Right handle on a rake" loading="lazy">
        <img src="./assets/tools/tool-7.png" alt="Reach Right handle on a snow shovel" loading="lazy">
        <img src="./assets/tools/tool-8.png" alt="Reach Right handle on a shovel" loading="lazy">
        <img src="./assets/tools/tool-9.png" alt="Reach Right handle on a scoop shovel" loading="lazy">
        <img src="./assets/tools/tool-10.png" alt="Reach Right handle on an ice scraper" loading="lazy">
        <img src="./assets/tools/tool-11.png" alt="Reach Right handle on a pitchfork" loading="lazy">
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
